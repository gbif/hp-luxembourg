# Footer configuration
# You should create one of these files for each language you support. E.g. /_data/es/footer.yml for the spanish version of the footer
# Footer content is organized in columns.
# You can also add a small print license statement at the bottom.

# Columns (the more you add, the narrower they will be)
columns:
  - name: Conservation Hub Luxembourg
    description: |
      biodiversitéit.lu is Luxembourg's biodiversity conservation hub, hosted by the Musée national d'histoire naturelle (MNHNL).
      It gathers information on species occurrences in Luxembourg and on the conservation efforts carried out by the national community.
    links:
    - text: Musée national d'histoire naturelle Luxembourg
      href: https://mnhn.lu

  - name: Explore
    description: |
      Browse the biodiversity data and tools of the portal.
    links:
    - text: Occurrences
      href: /occurrence/search
    - text: Checklists
      href: /dataset/search
    - text: Literature
      href: /literature/search
    - text: Alerts
      href: https://beta.biodiversiteit.lu
    - text: News
      href: /news/

  - name: Contact
    description: | # Can be Markdown
      Musée national d'histoire naturelle Luxembourg
      * 25 Rue Münster
      * L-2160
      * Luxembourg
    connectIcons: true # Show social icons (defined in _config.yml)


# Below is configuration for a small print license statement to add at the bottom of the footer. Can be Markdown
