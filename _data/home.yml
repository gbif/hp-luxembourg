# Data for the home page composition (English)
stats:
  title: The hub in numbers
  # The numbers fall back to the static values shown here and are replaced live (via data-ajax-url) when the page loads
  features:
    - title: '<span data-ajax-url="https://api.gbif.org/v1/occurrence/search?country=LU&limit=0">2.4M</span>'
      description: Occurrences in Luxembourg
      background: /assets/images/icons/occurrences.svg
      imageAlt: Map marker icon for occurrences
      href: /occurrence/search
    - title: '<span data-ajax-url="https://graphql.gbif.org/graphql?query=%7B%20occurrenceSearch(predicate%3A%20%7Btype%3A%20equals%2C%20key%3A%20%22countryCode%22%2C%20value%3A%20%22LU%22%7D%2C%20size%3A%200)%20%7B%20cardinality%20%7B%20taxonKey%20%7D%20%7D%20%7D" data-ajax-path="data.occurrenceSearch.cardinality.taxonKey">40,121</span>'
      description: Distinct taxa recorded
      background: /assets/images/icons/taxa.svg
      imageAlt: Leaf icon for distinct taxa
      href: /occurrence/search
    - title: '<span data-ajax-url="https://api.gbif.org/v1/dataset/search?type=CHECKLIST&publishingCountry=LU&limit=0">1</span>'
      description: Checklists published in Luxembourg
      background: /assets/images/icons/checklists.svg
      imageAlt: Checklist icon
      href: /dataset/search
    - title: '<span data-ajax-url="https://api.gbif.org/v1/dataset/search?publishingCountry=LU&limit=0">7</span>'
      description: Datasets published by Luxembourg
      background: /assets/images/icons/datasets.svg
      imageAlt: Database icon for datasets
      href: /dataset/search

latestPosts:
  title: Latest news
